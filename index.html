.utility{max-width:1200px;margin:0 auto .4rem;display:flex;gap:.7rem;justify-content:space-between;align-items:center;color:var(--muted);font-size:.8rem}.utility button{padding:.4rem .65rem}.page-title,.kit-head,.kit-actions{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}.page-title h1,.kit-head h2{margin-bottom:.3rem}.kit{margin:1rem 0}.kit-lines{display:grid;gap:.25rem;margin:1rem 0}.kit-line{display:grid;grid-template-columns:minmax(200px,1fr) minmax(160px,250px);gap:1rem;align-items:center;padding:.85rem .35rem;border-top:1px solid var(--line)}.kit-line label.check{display:flex;align-items:center;gap:.75rem}.check input{width:1.25rem;height:1.25rem;accent-color:var(--green)}.check small{display:block;font-weight:400;color:var(--muted);margin-top:.25rem}.search-label{margin:1rem 0;display:grid}.kit-actions{border-top:1px solid var(--line);padding-top:1rem}.card:hover{border-color:#bbd5c3}@media(max-width:650px){.kit-line{grid-template-columns:1fr}.utility{flex-wrap:wrap}}

function notify(s,error=false){let n=document.getElementById('notice');n.textContent=s;n.className=error?'error':'';n.style.display='block';setTimeout(()=>n.style.display='none',6000)}
async function call(fn,...args){const started=performance.now();let r;try{r=await fetch('/api/rpc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fn,args}),cache:'no-store',signal:AbortSignal.timeout(55000)})}catch(e){throw Error(e.name==='TimeoutError'?'Request timed out. Try again; check the activity before repeating a collection.':'Network unavailable. Check your connection.')}let payload;try{payload=await r.json()}catch{throw Error('The backend did not return JSON. Check the Apps Script deployment.')}if(!r.ok||!payload.ok)throw Error(payload.error||'The request failed.');lastPayload=payload;lastUpdated=new Date();let t=document.getElementById('perf');if(t)t.textContent=`Updated ${lastUpdated.toLocaleTimeString()} · ${Math.round(performance.now()-started)} ms (server ${payload.serverMs??'?'} ms)`;return payload.result}
async function run(fn,...args){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{let result=await call(fn,auth.token,...args);data=lastPayload?.snapshot||await call('snapshot',auth.token);render();notify('Saved successfully.');return result}catch(e){notify(e.message,true)}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
function login(){el.innerHTML=`<section class="card login"><img src="${LOGO}" alt="ARAHAS"><h1>Sign in to PPE management</h1><p class="muted">Authorized QHSE staff only.</p><form id="loginForm"><label>Username<input id="username" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button>Sign in</button></form></section>`;document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();let b=e.target.querySelector('button');b.disabled=true;try{auth=await call('signIn',v('username'),v('password'));data=lastPayload?.snapshot||await call('snapshot',auth.token);tab='Dashboard';render()}catch(err){notify(err.message,true)}finally{b.disabled=false}}}
async function logout(){try{await call('signOut',auth.token)}finally{auth=null;data=null;document.getElementById('identity').innerHTML='';login()}}
function render(){let admin=auth.role==='Admin';document.getElementById('identity').innerHTML=`<span>${esc(auth.username)} · ${esc(auth.role)}</span> <button class="secondary" id="logout">Sign out</button>`;let tabs=admin?['Dashboard','Employees','Rules','Inventory','Replacements','Reports']:['Dashboard','Collections','Employees','Replacements','My activity'];if(!tabs.includes(tab))tab='Dashboard';el.innerHTML=`<div class="utility"><span id="perf">${lastUpdated?'Updated '+lastUpdated.toLocaleTimeString():'Ready'}</span><button class="secondary" id="refresh" type="button" aria-label="Refresh live data">↻ Refresh</button></div><nav aria-label="Main navigation">${tabs.map(t=>`<button class="${t===tab?'active':''}" data-tab="${t}">${t}</button>`).join('')}</nav><div id="view"></div>`;document.getElementById('refresh').onclick=async()=>{try{data=await call('snapshot',auth.token);render();notify('Data refreshed.')}catch(e){notify(e.message,true)}};document.getElementById('logout').onclick=logout;el.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});let f={Dashboard:dashboard,Employees:employees,Rules:rules,Inventory:inventory,Collections:collections,Replacements:replacements,Reports:reports,'My activity':activity}[tab];f();}
function table(headers,rows){return `<div class="scroll"><table><thead><tr>${headers.map(h=>`<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(c=>`<td>${c??''}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${headers.length}">No records yet.</td></tr>`}</tbody></table></div>`}
function dashboard(){let pending=data.Employees.filter(e=>e.status==='Pending').length,open=data.Issuance_Log.filter(x=>x.item_status==='Pending').length,low=data.Inventory.filter(x=>+x.qty_on_hand<+x.low_stock_threshold);document.getElementById('view').innerHTML=`<h1>Dashboard</h1><div class="grid">${[['Employees pending approval',pending],['Items awaiting collection',open],['Low stock sizes',low.length],['Items issued',data.Issuance_Log.filter(x=>x.item_status==='Collected').length]].map(([k,n])=>`<div class="card"><div class="muted">${k}</div><div class="metric">${n}</div></div>`).join('')}</div><section class="card"><h2>Low stock</h2>${table(['Item','Size','On hand','Threshold'],low.slice(0,30).map(x=>[esc(name(x.item_id)),esc(x.size),x.qty_on_hand,x.low_stock_threshold]))}</section>${auth.role==='Admin'?`<section class="card"><h2>Recent stock movements</h2>${table(['When','Item','Size','Change','Reason','By'],data.Stock_Movements.slice(-12).reverse().map(m=>[esc(String(m.timestamp).slice(0,16).replace('T',' ')),esc(name(m.item_id)),esc(m.size),esc(m.delta),esc(m.reason),esc(m.actor)]))}</section>`:''}` }
function hasCollected(empId){return data.Issuance_Log.some(i=>i.employee_id===empId&&i.item_status==='Collected')}
function employees(){let admin=auth.role==='Admin',pending=data.Employees.filter(x=>x.status==='Pending');document.getElementById('view').innerHTML=`<h1>Employees</h1>${admin?`<section class="card"><h2>Add employee</h2><form class="row" id="addEmp"><label>Full name<input id="en" required minlength="3" maxlength="120"></label><label>Role<select id="er">${['Field Officer','Coordinator','Supervisor','Other'].map(x=>`<option>${x}</option>`).join('')}</select></label><button>Add employee</button></form></section><section class="card"><h2>Pending approval</h2>${pending.map(e=>`<div class="card"><strong>${esc(e.name)}</strong> · ${esc(e.role)}<p class="muted">Choose the items to approve, or discard this record if it was added by mistake.</p><form class="approval" data-id="${esc(e.internal_id)}"><div class="grid">${data.Entitlement_Rules.filter(r=>r.role===e.role&&r.active===true).map(r=>`<label><span><input style="width:auto" type="checkbox" name="item" value="${esc(r.item_id)}" checked> ${esc(name(r.item_id))} · qty ${esc(r.default_qty)}</span></label>`).join('')||'<p>No rules for this role. Configure Rules first.</p>'}</div><p><button>Approve selected items</button> <button type="button" class="danger discard-emp" data-id="${esc(e.internal_id)}">Discard employee</button></p></form></div>`).join('')||'<p>No pending employees.</p>'}</section>`:''}<section class="card"><h2>Employee directory</h2><label>Find employee<input id="findEmployee" placeholder="Name or ID"></label><div id="empTable"></div></section>`;if(admin){document.getElementById('addEmp').onsubmit=e=>{e.preventDefault();run('addEmployee',v('en'),v('er'))};document.querySelectorAll('.discard-emp').forEach(b=>b.onclick=()=>{if(confirm('Discard this employee record? This cannot be undone.'))run('deleteEmployee',b.dataset.id)});document.querySelectorAll('.approval').forEach(f=>f.onsubmit=e=>{e.preventDefault();let ids=[...f.querySelectorAll('input:checked')].map(i=>i.value);if(confirm(`Approve ${ids.length} PPE items for this employee?`))run('approveEmployee',f.dataset.id,ids)})}let show=()=>{let q=v('findEmployee').toLowerCase();document.getElementById('empTable').innerHTML=table(['ID','Name','Role','Status','Issued / pending','Action'],data.Employees.filter(e=>`${e.name} ${e.employee_id}`.toLowerCase().includes(q)).map(e=>{let deletable=admin&&!hasCollected(e.employee_id);return [esc(e.employee_id||'Pending ID'),esc(e.name),esc(e.role),status(e.status),`${data.Issuance_Log.filter(i=>i.employee_id===e.employee_id&&i.item_status==='Collected').length} / ${data.Issuance_Log.filter(i=>i.employee_id===e.employee_id&&i.item_status==='Pending').length}`,`<button class="secondary history-employee" data-id="${esc(e.internal_id)}">History</button> ${admin?`<button class="secondary edit-employee" data-id="${esc(e.internal_id)}">Edit</button>`:''} ${deletable?`<button class="danger delete-employee" data-id="${esc(e.internal_id)}">Delete</button>`:''}`]}))};document.getElementById('findEmployee').oninput=show;show();document.getElementById('empTable').onclick=event=>{let del=event.target.closest('.delete-employee');if(del){if(confirm('Delete this employee and their pending items? This cannot be undone.'))run('deleteEmployee',del.dataset.id);return}let history=event.target.closest('.history-employee');if(history){let person=data.Employees.find(x=>x.internal_id===history.dataset.id);if(!person)return;let lines=data.Issuance_Log.filter(x=>x.employee_id&&x.employee_id===person.employee_id);document.getElementById('historyTitle').textContent=person.name+' · '+(person.employee_id||'Awaiting approval');document.getElementById('historyBody').innerHTML=`<div class="scroll"><table><thead><tr><th>Item</th><th>Size</th><th>Qty</th><th>Status</th><th>Date</th><th>Issued by</th>${admin?'<th>Action</th>':''}</tr></thead><tbody>${lines.length?lines.map(x=>`<tr><td>${esc(name(x.item_id))}</td><td>${esc(x.size||'—')}</td><td>${esc(x.qty)}</td><td>${status(x.item_status)}</td><td>${esc(String(x.date_issued||'—').slice(0,16))}</td><td>${esc(x.issued_by||'—')}</td>${admin?`<td>${x.item_status==='Pending'?`<button class="secondary remove-line" data-id="${esc(x.line_id)}">Remove</button>`:x.item_status==='Collected'?`<button class="danger undo-line" data-id="${esc(x.line_id)}">Undo</button>`:''}</td>`:''}</tr>`).join(''):`<tr><td colspan="${admin?7:6}">No records yet.</td></tr>`}</tbody></table></div>`;document.getElementById('historyDialog').showModal();return}let b=event.target.closest('.edit-employee');if(!b)return;let e=data.Employees.find(x=>x.internal_id===b.dataset.id);if(!e)return;let d=document.getElementById('editDialog');d.querySelector('[name=internalId]').value=e.internal_id;d.querySelector('[name=employeeName]').value=e.name;d.querySelector('[name=employeeRole]').value=e.role;d.querySelector('[name=employeeRole]').disabled=e.status!=='Pending';d.showModal()}}
document.getElementById('historyBody').addEventListener('click',event=>{let rm=event.target.closest('.remove-line');if(rm){if(confirm('Remove this item from the employee\'s approved kit? This cannot be undone.'))run('removeIssuanceLine',rm.dataset.id).then(r=>{if(r)document.getElementById('historyDialog').close()});return}let un=event.target.closest('.undo-line');if(un){let reason=prompt('Why is this collection being undone? (goes back into stock)');if(reason&&reason.trim().length>=4)run('undoCollection',un.dataset.id,reason.trim()).then(r=>{if(r)document.getElementById('historyDialog').close()});else if(reason!==null)notify('Give a reason of at least 4 characters.',true)}});
function rules(){let view=document.getElementById('view');view.innerHTML=`<h1>Entitlement rules</h1><p class="muted">Rules apply to future approvals only. Set them before approving new staff. Setting "Active" to No keeps history but stops it being offered; Delete removes the row entirely.</p><section class="card"><form class="row" id="ruleForm"><label>Role<select id="rr">${['Field Officer','Coordinator','Supervisor','Other'].map(x=>`<option>${x}</option>`).join('')}</select></label><label>Item<select id="ri">${data.Item_Catalog.filter(x=>x.active).map(x=>`<option value="${x.item_id}">${esc(x.item_category)}</option>`).join('')}</select></label><label>Quantity<input id="rq" type="number" min="1" value="1" required></label><label>Active<select id="ra"><option value="true">Yes</option><option value="false">No</option></select></label><button>Save rule</button></form></section><section class="card"><div class="scroll"><table><thead><tr><th>Role</th><th>Item</th><th>Quantity</th><th>Active</th><th>Action</th></tr></thead><tbody>${data.Entitlement_Rules.length?data.Entitlement_Rules.map(r=>`<tr><td>${esc(r.role)}</td><td>${esc(name(r.item_id))}</td><td>${esc(r.default_qty)}</td><td>${r.active?'Yes':'No'}</td><td><button class="danger delete-rule" data-id="${esc(r.rule_id)}">Delete</button></td></tr>`).join(''):'<tr><td colspan="5">No rules yet.</td></tr>'}</tbody></table></div></section>`;document.getElementById('ruleForm').onsubmit=e=>{e.preventDefault();run('setRule',v('rr'),v('ri'),Number(v('rq')),v('ra')==='true')};document.querySelectorAll('.delete-rule').forEach(b=>b.onclick=()=>{if(confirm('Delete this entitlement rule?'))run('deleteRule',b.dataset.id)})}
function inventory(){let rows=data.Inventory;document.getElementById('view').innerHTML=`<h1>Inventory</h1><p class="muted">Enter verified stock counts as signed adjustments. Every change is recorded.</p><section class="card"><form class="row" id="stockForm"><label>Item / size<select id="si">${rows.map(r=>`<option value="${esc(r.item_id)}|${esc(r.size)}">${esc(name(r.item_id))} · ${esc(r.size)} · ${r.qty_on_hand} on hand</option>`).join('')}</select></label><label>Change (+ / −)<input id="sd" type="number" step="1" value="0" required></label><label>Low stock threshold<input id="st" type="number" min="0" step="1" value="10" required></label><label>Reason<input id="sr" required minlength="4" placeholder="Stock count / delivery / damage"></label><button>Save adjustment</button></form></section><section class="card"><label>Find item or size<input id="stockFind"></label><div id="stockTable"></div></section>`;document.getElementById('si').onchange=()=>{let [id,size]=v('si').split('|');document.getElementById('st').value=rows.find(r=>r.item_id===id&&r.size===size)?.low_stock_threshold??10};document.getElementById('stockForm').onsubmit=e=>{e.preventDefault();let [id,size]=v('si').split('|');if(confirm('Apply this stock change?'))run('adjustStock',id,size,Number(v('sd')),v('sr'),Number(v('st')))};let show=()=>{let q=v('stockFind').toLowerCase();document.getElementById('stockTable').innerHTML=table(['Item','Size','On hand','Threshold','Status'],rows.filter(r=>`${name(r.item_id)} ${r.size}`.toLowerCase().includes(q)).map(r=>[esc(name(r.item_id)),esc(r.size),r.qty_on_hand,r.low_stock_threshold,+r.qty_on_hand<+r.low_stock_threshold?'<span class="badge low">Low</span>':'OK']))};document.getElementById('stockFind').oninput=show;show()}
function collections(){let lines=data.Issuance_Log.filter(x=>x.item_status==='Pending');let grouped=lines.reduce((g,x)=>{(g[x.employee_id]??=[]).push(x);return g},{});document.getElementById('view').innerHTML=`<div class="page-title"><div><h1>Collections</h1><p class="muted">Prepare one employee's kit, then confirm selected items together. Out-of-stock items stay pending.</p></div><div class="badge">${lines.length} pending lines</div></div><label class="search-label">Search employee or PPE<input id="issueFind" placeholder="Enter a name, employee ID, or item"></label><div id="issueList"></div>`;let show=()=>{let q=v('issueFind').toLowerCase();document.getElementById('issueList').innerHTML=Object.entries(grouped).filter(([id,ls])=>`${emp(id)?.name} ${id} ${ls.map(l=>name(l.item_id)).join(' ')}`.toLowerCase().includes(q)).map(([id,ls])=>`<section class="card kit"><div class="kit-head"><div><h2>${esc(emp(id)?.name||id)}</h2><div class="muted">${esc(id)} · ${ls.length} outstanding</div></div><span class="badge warn">Awaiting collection</span></div><form class="kit-form" data-emp="${esc(id)}"><div class="kit-lines">${ls.map(x=>`<div class="kit-line" data-line="${esc(x.line_id)}"><label class="check"><input type="checkbox" name="pick" value="${esc(x.line_id)}"> <span><strong>${esc(name(x.item_id))}</strong><small>${esc(x.batch_type)} · ${esc(x.qty)} ${esc(data.Item_Catalog.find(i=>i.item_id===x.item_id)?.uom||'units')}</small></span></label><label>Size / available stock<select data-size="${esc(x.line_id)}">${data.Inventory.filter(stock=>stock.item_id===x.item_id).map(stock=>`<option value="${esc(stock.size)}" ${Number(stock.qty_on_hand)<Number(x.qty)?'disabled':''}>${esc(stock.size)} · ${stock.qty_on_hand} available</option>`).join('')}</select></label></div>`).join('')}</div><div class="kit-actions"><button type="submit">Confirm selected collection</button><span class="muted">Only checked items are issued.</span></div></form></section>`).join('')||'<section class="card">No matching pending collections.</section>';document.querySelectorAll('.kit-form').forEach(f=>f.onsubmit=e=>{e.preventDefault();let selected=[...f.querySelectorAll('input[name=pick]:checked')].map(i=>({lineId:i.value,size:f.querySelector(`select[data-size="${i.value}"]`)?.value}));if(!selected.length){notify('Select at least one item.',true);return}if(selected.some(x=>!x.size)){notify('Choose an in-stock size for every selected item.',true);return}if(confirm(`Issue ${selected.length} selected item(s) to ${emp(f.dataset.emp)?.name}?`))run('issueBatch',selected)})};document.getElementById('issueFind').oninput=show;show()}
function replacements(){let admin=auth.role==='Admin';document.getElementById('view').innerHTML=`<h1>Replacement requests</h1>${admin?`<section class="card"><h2>Awaiting decision</h2>${data.Replacement_Requests.filter(x=>x.status==='Pending').map(r=>`<form class="card decision" data-id="${esc(r.request_id)}"><strong>${esc(emp(r.employee_id)?.name||r.employee_id)}</strong> · ${esc(name(r.item_id))}<p>${esc(r.reason)}</p><div class="row"><label>Approved quantity<input name="qty" type="number" min="1" max="1000" value="1"></label><button type="submit" data-decision="yes">Approve</button><button type="submit" class="danger" data-decision="no">Reject</button></div></form>`).join('')||'<p>No pending requests.</p>'}</section>`:`<section class="card"><h2>Request replacement</h2><form id="requestForm" class="row"><label>Employee<select id="re">${data.Employees.filter(x=>x.employee_id).map(x=>`<option value="${esc(x.employee_id)}">${esc(x.name)} · ${esc(x.employee_id)}</option>`).join('')}</select></label><label>Item<select id="rit">${data.Item_Catalog.filter(x=>x.active).map(x=>`<option value="${x.item_id}">${esc(x.item_category)}</option>`).join('')}</select></label><label>Reason<input id="reason" required minlength="5" maxlength="500"></label><button>Submit request</button></form></section>`}<section class="card"><h2>Request history</h2>${table(['Employee','Item','Reason','Status'],data.Replacement_Requests.slice().reverse().map(r=>[esc(emp(r.employee_id)?.name||r.employee_id),esc(name(r.item_id)),esc(r.reason),status(r.status)]))}</section>`;if(admin)document.querySelectorAll('.decision').forEach(f=>{f.querySelectorAll('[data-decision]').forEach(b=>b.onclick=()=>f.dataset.choice=b.dataset.decision);f.onsubmit=e=>{e.preventDefault();let yes=f.dataset.choice==='yes';if(confirm(`${yes?'Approve':'Reject'} replacement?`))run('decideReplacement',f.dataset.id,yes,Number(f.querySelector('[name=qty]').value))}});else document.getElementById('requestForm').onsubmit=e=>{e.preventDefault();run('requestReplacement',v('re'),v('rit'),v('reason'))}}
function logs(mine){return data.Issuance_Log.filter(x=>x.item_status==='Collected'&&(!mine||x.issued_by===auth.username))}function reportTable(lines){return table(['Date','Employee','Role','Item','Size','Qty','Issued by','Batch'],lines.map(x=>[esc(String(x.date_issued).slice(0,10)),esc(emp(x.employee_id)?.name||x.employee_id),esc(emp(x.employee_id)?.role||''),esc(name(x.item_id)),esc(x.size),x.qty,esc(x.issued_by),esc(x.batch_type)]))}function activity(){document.getElementById('view').innerHTML=`<h1>My activity</h1><section class="card">${reportTable(logs(true).reverse())}</section>`}
function reports(){document.getElementById('view').innerHTML=`<h1>Issuance reports</h1><section class="card"><div class="row"><label>From<input type="date" id="from"></label><label>To<input type="date" id="to"></label><label>Role<select id="roleFilter"><option value="">All roles</option>${['Field Officer','Coordinator','Supervisor','Other'].map(x=>`<option>${x}</option>`).join('')}</select></label><label>Item<select id="itemFilter"><option value="">All items</option>${data.Item_Catalog.map(x=>`<option value="${x.item_id}">${esc(x.item_category)}</option>`).join('')}</select></label><button id="csv">Export CSV</button><button class="secondary" id="print">Print</button></div><div id="report"></div></section><section class="card"><h2>Outstanding approvals</h2>${table(['Employee','Role','Pending items'],data.Employees.filter(e=>data.Issuance_Log.some(x=>x.employee_id===e.employee_id&&x.item_status==='Pending')).map(e=>[esc(e.name),esc(e.role),data.Issuance_Log.filter(x=>x.employee_id===e.employee_id&&x.item_status==='Pending').length]))}</section>`;let filtered=()=>logs(false).filter(x=>(!v('from')||String(x.date_issued).slice(0,10)>=v('from'))&&(!v('to')||String(x.date_issued).slice(0,10)<=v('to'))&&(!v('roleFilter')||emp(x.employee_id)?.role===v('roleFilter'))&&(!v('itemFilter')||x.item_id===v('itemFilter')));let show=()=>document.getElementById('report').innerHTML=reportTable(filtered().reverse());['from','to','roleFilter','itemFilter'].forEach(id=>document.getElementById(id).onchange=show);document.getElementById('print').onclick=()=>window.print();document.getElementById('csv').onclick=()=>{let fields=['date_issued','employee_id','employee_name','role','item_id','item','size','qty','issued_by','batch_type','issuance_id'];let lines=filtered().map(x=>[x.date_issued,x.employee_id,emp(x.employee_id)?.name,emp(x.employee_id)?.role,x.item_id,name(x.item_id),x.size,x.qty,x.issued_by,x.batch_type,x.issuance_id]);let csv=[fields,...lines].map(row=>row.map(z=>'"'+String(z??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff',csv],{type:'text/csv;charset=utf-8'}));a.download='ARAHAS-PPE-issuance.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)};show()}
document.getElementById('closeHistory').onclick=()=>document.getElementById('historyDialog').close();document.getElementById('cancelEdit').onclick=()=>document.getElementById('editDialog').close();document.getElementById('editForm').onsubmit=e=>{e.preventDefault();let f=e.target,record=data.Employees.find(x=>x.internal_id===f.elements.internalId.value);document.getElementById('editDialog').close();if(record)run('editEmployee',record.internal_id,f.elements.employeeName.value.trim(),f.elements.employeeRole.disabled?record.role:f.elements.employeeRole.value)};
login();
</script></body></html>
